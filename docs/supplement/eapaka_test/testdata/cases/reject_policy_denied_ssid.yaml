# INT-AUTH-AKA-007関連: SSID不一致による拒否
# ポリシーでTESTSSID-01のみ許可されているIMSIに対し、TESTSSID-02で接続
# config: config_testvector.yaml（called_station_idをケース側で上書き）
#   IMSI 003 だが、テストベクターモードでは AMF=B9B9（Test Set 1 固定値）になるため config_testvector.yaml を使う。
#   config_testvector_imsi003.yaml（AMF=8000）は実計算モード（TEST_VECTOR_ENABLED=false）専用。
version: 1
name: reject_policy_denied_ssid
identity: "0001010000000003@wlan.mnc001.mcc001.3gppnetwork.org"
radius:
  attributes:
    called_station_id: "00-10-A4-23-19-C0:TESTSSID-02"
    nas_identifier: "Customer01"
expect:
  result: reject
