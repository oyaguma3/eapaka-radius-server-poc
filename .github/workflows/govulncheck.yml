# 依存と標準ライブラリの既知の脆弱性を govulncheck で調べる。
# 脆弱性の情報はコードを変えなくても増えるので、push のときに加えて週に 1 回も実行する。
name: govulncheck

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # 毎週月曜 9 時台（日本時間）。毎時 0 分は混み合って遅れやすいので、少しずらす。
    - cron: "23 0 * * 1"

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      # go.work の直下では動かないので、モジュールごとに実行する（Makefile の vulncheck）。
      - name: govulncheck
        run: make vulncheck
