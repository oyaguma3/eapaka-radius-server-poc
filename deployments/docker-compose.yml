x-logging: &fluent-bit-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    fluentd-buffer-limit: "1048576"

x-timezone: &timezone
  TZ: Asia/Tokyo

services:
  # ==========================================================================
  # Logic Layer
  # ==========================================================================
  auth-server:
    build:
      context: ..
      dockerfile: apps/auth-server/Dockerfile
    ports:
      - "1812:1812/udp"
    environment:
      <<: *timezone
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASS: ${VALKEY_PASSWORD}
      VECTOR_API_URL: http://vector-gateway:8080
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      LOG_MASK_IMSI: ${LOG_MASK_IMSI:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      valkey:
        condition: service_healthy
      vector-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-x", "auth-server"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.auth-server"

  acct-server:
    build:
      context: ..
      dockerfile: apps/acct-server/Dockerfile
    ports:
      - "1813:1813/udp"
    environment:
      <<: *timezone
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASS: ${VALKEY_PASSWORD}
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      LOG_MASK_IMSI: ${LOG_MASK_IMSI:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-x", "acct-server"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.acct-server"

  vector-gateway:
    build:
      context: ..
      dockerfile: apps/vector-gateway/Dockerfile
    expose:
      - "8080"
    environment:
      <<: *timezone
      VECTOR_GATEWAY_MODE: ${VECTOR_GATEWAY_MODE:-gateway}
      VECTOR_GATEWAY_INTERNAL_URL: http://vector-api:8080
      VECTOR_GATEWAY_PLMN_MAP: ${VECTOR_GATEWAY_PLMN_MAP:-}
      VECTOR_GATEWAY_INTERNAL_TIMEOUT: ${VECTOR_GATEWAY_INTERNAL_TIMEOUT:-3s}
      # aka-only-server（接続方式ID:01）。URLが空なら01は無効
      VECTOR_GATEWAY_AKAONLY_URL: ${VECTOR_GATEWAY_AKAONLY_URL:-}
      VECTOR_GATEWAY_AKAONLY_CLIENT_CERT: ${VECTOR_GATEWAY_AKAONLY_CLIENT_CERT:-}
      VECTOR_GATEWAY_AKAONLY_CLIENT_KEY: ${VECTOR_GATEWAY_AKAONLY_CLIENT_KEY:-}
      VECTOR_GATEWAY_AKAONLY_SERVER_CERT: ${VECTOR_GATEWAY_AKAONLY_SERVER_CERT:-}
      VECTOR_GATEWAY_AKAONLY_TIMEOUT: ${VECTOR_GATEWAY_AKAONLY_TIMEOUT:-3s}
      LOG_MASK_IMSI: ${LOG_MASK_IMSI:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # aka-only-server接続用の証明書（av-client.pem / av-server.pem）
      - ./certs:/certs:ro
    depends_on:
      vector-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.vector-gateway"

  vector-api:
    build:
      context: ..
      dockerfile: apps/vector-api/Dockerfile
    expose:
      - "8080"
    environment:
      <<: *timezone
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASS: ${VALKEY_PASSWORD}
      LOG_MASK_IMSI: ${LOG_MASK_IMSI:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # テストベクターモード（開発・テスト専用。本番では有効にしないこと）
      TEST_VECTOR_ENABLED: ${TEST_VECTOR_ENABLED:-false}
      TEST_VECTOR_IMSI_PREFIX: ${TEST_VECTOR_IMSI_PREFIX:-00101}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.vector-api"

  # ==========================================================================
  # Management Layer
  # ==========================================================================
  # Provisioning API（D-13）。本PoCの外の BFF から、加入者・RADIUSクライアント・
  # 認可ポリシーを操作する REST API（HTTPS + mTLS）。証明書の準備が要るため
  # profile に入れており、既定の `docker compose up` では起動しない。
  #   docker compose --profile provisioning up -d
  # 同じホストの BFF（別の compose）は、ホストの 127.0.0.1 に届かないため、
  # 共有ネットワーク（既定名 eapaka-prov）に参加して https://provisioning-api:9444 で接続する。
  provisioning-api:
    build:
      context: ..
      dockerfile: apps/provisioning-api/Dockerfile
    profiles: ["provisioning"]
    ports:
      # 既定はループバックだけ。別ノードの BFF から使う場合は .env の PROVISIONING_API_BIND を変える
      - "${PROVISIONING_API_BIND:-127.0.0.1}:9444:9444/tcp"
    environment:
      <<: *timezone
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASS: ${VALKEY_PASSWORD}
      PROVISIONING_API_TLS_CERT: /certs/server.pem
      PROVISIONING_API_TLS_KEY: /certs/server.key
      # 管理クライアントの「識別名=フィンガープリント」。空なら起動しない
      PROVISIONING_API_ADMIN_CLIENTS: ${PROVISIONING_API_ADMIN_CLIENTS:-}
      PROVISIONING_API_NODE_NAME: ${PROVISIONING_API_NODE_NAME:-}
      # GET /audit-logs で参照できる監査ログ（Valkey の Stream audit:prov）の件数の上限
      PROVISIONING_API_AUDIT_MAX: ${PROVISIONING_API_AUDIT_MAX:-10000}
      LOG_MASK_IMSI: ${LOG_MASK_IMSI:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # サーバー証明書（server.pem / server.key）。SAN に DNS:provisioning-api を入れる
      - ./certs/provisioning:/certs:ro
    networks:
      - default
      # 同じホストの BFF 用の共有ネットワーク（provisioning-api だけを参加させる）
      - provisioning-shared
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      # /status は mTLS が要るため、プロセスの確認にする。
      # プロセス名（comm）は15文字までに切り詰められ "provisioning-api" と一致しないため、-x ではなく -f で照合する
      test: ["CMD", "pgrep", "-f", "/usr/local/bin/provisioning-api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.provisioning-api"

  # ==========================================================================
  # Data Layer
  # ==========================================================================
  valkey:
    image: valkey/valkey:9.0
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${VALKEY_PASSWORD}
    environment:
      <<: *timezone
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always
    logging:
      <<: *fluent-bit-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "1048576"
        tag: "app.valkey"

  # ==========================================================================
  # Logging Layer
  # ==========================================================================
  fluent-bit:
    image: fluent/fluent-bit:4.2
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    # Docker のログドライバーはホストの localhost:24224 に接続する。外部には公開しない
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:24224:24224/udp"
    volumes:
      - ../configs/fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./logs_on_host:/output_logs
    environment:
      <<: *timezone
    restart: always

volumes:
  valkey_data:

networks:
  # 同じホストの BFF と provisioning-api の共有ネットワーク（D-13 §2.2）。
  # 本 compose が作り、BFF 側は外部ネットワーク（external）として参加する。
  # provisioning-api を起動したとき（profile provisioning）だけ作られる。
  provisioning-shared:
    name: ${PROVISIONING_SHARED_NETWORK:-eapaka-prov}
